# Added by scripts/setup-buzz-profile. A Buzz agent's profile uploads nothing:
# these rows turn off each upload that dsh's ACP template loads.

- id: session-log-deepseek
  config:
    enabled: false

- id: plugin-package-inventory-deepseek
  config:
    enabled: false

- id: session-telemetry-otel
  disabled: true

# Owner decision: condense near 250K tokens on any model window. Models with a
# small window still condense earlier, at the bundle's ratio.
- id: auto-compact
  config:
    thresholdTokens: 250000
