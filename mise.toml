# Tools for this repository. Run them through mise (`mise exec -- …`), so
# every machine builds and checks with the same releases. The build tools
# themselves (Vite, TypeScript, Biome) come from this repository's lockfile.
[tools]
node = "24.22.3"
pnpm = "12.22.0"
markdownlint-cli2 = "0.24.1"
shfmt = "3.14.1"
