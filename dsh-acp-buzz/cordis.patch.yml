# dsh-acp-buzz: dsh's ACP server behind the Buzz bridge.
#
# A patch cannot swap the module of an existing row, so the base `acp` row
# is disabled and this row runs the same server through the bridge. List
# this bundle after `@deepseek-ai/dsh-acp-app` so the `acp` row exists.
#
# A patch replaces a row's whole config. The provider and model below are
# the dsh-acp-app defaults; set your own on this row (`id: acp-buzz`) in the
# profile's cordis.patch.yml, as you would on `acp` without this bundle.
#
# The upload rows live here, not in a profile, so that each profile with this
# bundle uploads nothing, also one made without scripts/setup-buzz-profile.
# dsh-base defines all three. They add session logs and package lists to model
# requests, and export session telemetry. A row that a profile's own patch
# sets later still wins, as for any row.
- id: session-log-deepseek
  config:
    enabled: false

- id: plugin-package-inventory-deepseek
  config:
    enabled: false

- id: session-telemetry-otel
  disabled: true

- id: acp
  disabled: true

- insert:
    - id: acp-buzz
      name: '@sagmans/dsh-acp-buzz'
      inject: [acpAppStartup]
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
